<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ออฟไลน์ — คลังภาพกิจกรรม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Sarabun:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1a1a2e; --accent: #3d5af1; --accent2: #6979f8;
      --muted: #8888aa; --surface2: #f7f7fb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--ink);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
    }
    .orb1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; }
    .orb2 { width: 300px; height: 300px; background: var(--accent2); bottom: -80px; right: -80px; }
    .content {
      position: relative;
      z-index: 1;
      max-width: 380px;
    }
    .icon-wrap {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: rgba(61,90,241,0.15);
      border: 2px solid rgba(105,121,248,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem;
      margin: 0 auto 28px;
      animation: pulse 2.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(61,90,241,0.3); }
      50%      { box-shadow: 0 0 0 16px rgba(61,90,241,0); }
    }
    h1 {
      font-family: 'Noto Serif Thai', serif;
      font-size: 1.7rem;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    p {
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      line-height: 1.7;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--accent);
      color: #fff;
      border-radius: 99px;
      font-family: 'Sarabun', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 6px 20px rgba(61,90,241,0.4);
    }
    .btn:hover { opacity: 0.88; transform: translateY(-2px); }
    .status {
      margin-top: 24px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }
    .dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #e84040;
      margin-right: 6px;
      animation: blink 1.4s ease-in-out infinite;
      vertical-align: middle;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
</head>
<body>
  <div class="bg-orb orb1"></div>
  <div class="bg-orb orb2"></div>
  <div class="content">
    <div class="icon-wrap">📡</div>
    <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>ขณะนี้คุณออฟไลน์อยู่<br>
    กรุณาตรวจสอบการเชื่อมต่อเครือข่าย แล้วลองใหม่อีกครั้ง</p>
    <a href="./" class="btn" onclick="window.location.reload(); return false;">
      🔄 ลองใหม่อีกครั้ง
    </a>
    <div class="status">
      <span class="dot"></span>ออฟไลน์อยู่ในขณะนี้
    </div>
  </div>
  <script>
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
